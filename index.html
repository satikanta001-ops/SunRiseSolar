const ATT = {
  P:{ label:'Present', short:'P', cls:'ok' }, A:{ label:'Absent', short:'A', cls:'out' }, H:{ label:'Half day', short:'H', cls:'low' },
  L:{ label:'Paid leave', short:'L', cls:'owner' }, O:{ label:'Off / Holiday', short:'O', cls:'off' } };
let HR = { date: todayStr(), month: todayStr().slice(0,7) };
const dim = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const monthName = ym => new Date(ym + '-01T00:00').toLocaleDateString('en-IN', { month:'long', year:'numeric' });

async function loadHr(){
  const [employees, attendance, transactions, users] = await Promise.all([DB.list('employees'), DB.list('attendance'), DB.list('transactions'), DB.list('users')]);
  return { employees, attendance, transactions, users };
}
function attCounts(att, empId, ym){
  const c = { P:0, A:0, H:0, L:0, O:0 };
  att.forEach(a => { if(a.empId === empId && a.date.startsWith(ym)) c[a.status]++; });
  return c;
}
function salaryFor(emp, ym, att){
  const c = attCounts(att, emp.id, ym), days = dim(ym), sal = Number(emp.salary || 0);
  if(emp.salaryType === 'daily') return { c, days, gross: Math.round(sal * (c.P + c.L + c.H / 2)) };
  let preJoin = 0;
  if(emp.joinDate){
    if(emp.joinDate.slice(0,7) > ym) return { c, days, gross:0 };
    if(emp.joinDate.slice(0,7) === ym) preJoin = Number(emp.joinDate.slice(8)) - 1;
  }
  return { c, days, gross: Math.max(Math.round(sal - (c.A + c.H / 2 + preJoin) * sal / days), 0) };
}
function advanceBal(tx, empId){
  return r2(tx.reduce((a,t) => a + (t.empId !== empId ? 0 : t.type === 'advance' ? Number(t.amount) : t.type === 'salary' ? -Number(t.advanceDeduct || 0) : 0), 0));
}

function renderHr(args = []){
  const tab = args[0] || 'attendance';
  const tabs = [['attendance','🗓️ Attendance'],['register','📋 Monthly Register'],['employees','👤 Employees'],['salary','💰 Salary']];

  if(tab === 'employees') return hrEmployees();
  if(tab === 'emp') return hrProfile(args[1]);
  if(tab === 'salary') return hrSalary();
  return hrAttendance();
}

function hrShift(n){ const dt = new Date(HR.date + 'T00:00'); dt.setDate(dt.getDate() + n); const s = new Date(dt.getTime() - dt.getTimezoneOffset() * 60000).toISOString().slice(0,10); if(s <= todayStr()){ HR.date = s; hrAttendance(); } }
async function hrMark(empId, status){
  const att = await DB.list('attendance'), id = empId + '_' + HR.date, i = att.findIndex(a => a.id === id);
  if(i > -1 && att[i].status === status) att.splice(i, 1);
  else if(i > -1) Object.assign(att[i], { status, by:ME.name, at:Date.now() });
  else att.push({ id, empId, date:HR.date, status, by:ME.name, at:Date.now() });
  await DB.saveAll('attendance', att); hrAttendance();
}
async function hrMarkAll(status){
  const emps = (await DB.list('employees')).filter(e => e.active !== false);
  const att = await DB.list('attendance');
  const marked = new Set(att.filter(a => a.date === HR.date).map(a => a.empId));
  const todo = emps.filter(e => !marked.has(e.id));
  if(!todo.length) return toast('Everyone is already marked');
  todo.forEach(e => att.push({ id:e.id + '_' + HR.date, empId:e.id, date:HR.date, status, by:ME.name, at:Date.now() }));
  await DB.saveAll('attendance', att); toast(`Marked ${todo.length} as ${ATT[status].label}`); hrAttendance();
}

function slCalc(){ const n = r2(Number($('#slGross').value || 0) - Number($('#slAdv').value || 0)); $('#slNet').textContent = money(n); $('#slNet').style.color = n < 0 ? 'var(--danger)' : ''; }
async function saveSalary(id, adv){
  const gross = r2($('#slGross').value || 0), cut = r2($('#slAdv').value || 0), date = $('#slDate').value, mode = $('#slMode').value, ym = $('#slMonth').value;
  if(!(gross > 0)) return toast('Enter salary amount');

  if(cut > gross) return toast('Advance cut can’t be more than the salary');
  if(!date || !ym) return toast('Select month and date');
  const e = (await DB.list('employees')).find(x => x.id === id);
  await DB.add('transactions', { type:'salary', empId:id, empName:e.name, month:ym, gross, advanceDeduct:cut, amount:r2(gross - cut), date, mode,
    account:accOf(mode), note:$('#slNote').value.trim(), addedBy:ME.id, addedByName:ME.name, createdAt:Date.now() });
  closeModal(); toast('Salary paid'); hrRefresh();

async function saveAdvance(id){
  const amount = r2($('#avAmt').value), date = $('#avDate').value, mode = $('#avMode').value;

  const e = (await DB.list('employees')).find(x => x.id === id);
  await DB.add('transactions', { type:'advance', empId:id, empName:e.name, amount, date, mode, account:accOf(mode), note:$('#avNote').value.trim(),

async function deleteHrTx(id){
  const tx = await DB.list('transactions'), t = tx.find(x => x.id === id);

    const after = advanceBal(tx.filter(x => x.id !== id), t.empId);

  if(!confirm('Delete this entry?')) return;
  await DB.remove('transactions', id); toast('Deleted'); hrRefresh();
}

const REPORTS = [
  ['sales','🧾 Sales Register'],['gst','🏛️ GST Summary'],['hsn','🔢 HSN Summary'],['items','📦 Item-wise Profit'],
  ['purchases','🛒 Purchase Register'],['expenses','💸 Expenses'],['dues','📥 Customer Dues'],['payables','📤 Vendor Dues'],

let R = { type:'sales', from: todayStr().slice(0,8) + '01', to: todayStr(), month: todayStr().slice(0,7), last:null };
const NO_RANGE = ['dues','payables','stock','health'];

function renderReports(args = []){
  if(args[0] && REPORTS.some(r => r[0] === args[0])) R.type = args[0];
  $('#main').innerHTML = `
    <div class="grid2 rep-grid">
      <div class="card sticky rep-menu">${REPORTS.map(([k, l]) => `<button class="${R.type === k ? 'on' : ''}" onclick="location.hash='reports/${k}'">${l}</button>`).join('')}</div>

async function repRun(){
  const d = { ...(await loadAcc()), ...(await loadHr()), activity: await DB.list('activity') };
  const def = await REP_BUILD[R.type](d);
  R.last = def;
  const range = R.type === 'salary'
    ? `<input type="month" value="${R.month}" onchange="R.month=this.value;repRun()" style="width:auto">`
    : NO_RANGE.includes(R.type) ? `<span class="muted">As of today</span>`

      if((paid[i.id] || 0) > i.total + 0.01) issues.push(['Payments', `Bill ${i.no} has received ${money(paid[i.id])}, more than its total ${money(i.total)}.`]);

    });

    const purIds = new Set(d.purchases.map(p => p.id));
    d.movements.forEach(m => { if(m.purchaseId && !purIds.has(m.purchaseId)) issues.push(['Purchases', `Stock-in for ${m.productName} is linked to a deleted purchase.`]); });
    d.transactions.forEach(t => { if(t.type === 'vendor_payment' && t.purchaseId && !purIds.has(t.purchaseId)) issues.push(['Purchases', `Vendor payment of ${money(t.amount)} is linked to a deleted purchase.`]); });
    d.employees.forEach(e => { if(advanceBal(d.transactions, e.id) < 0) issues.push(['HR', `${e.name}: more advance recovered than was given.`]); });

    const bal = accBalances(d);
    if(bal.Cash < 0) uniq.push(['Cash', `Cash in hand is negative (${money(bal.Cash)}). Check the opening balance or payment modes.`]);
    return { html: uniq.length
      ? `<p style="margin-bottom:8px"><b style="color:var(--danger)">${uniq.length} thing${uniq.length > 1 ? 's' : ''} to look at:</b></p>` + uniq.map(([a, t]) => `<div class="list-item"><span class="badge low">${a}</span><div class="grow">${esc(t)}</div></div>`).join('')
      : `<div class="empty" style="font-size:15px">✅ Everything checks out — stock, bills, payments, purchases and advances are consistent.</div>`,
      note:'Scans your data for mismatches between stock, bills, payments, purchases and staff advances. Nothing is changed automatically.' };
  }
};

const LOG_SKIP = new Set(['activity','attendance','stock']);
const LOG_NAME = { users:'user', products:'product', customers:'customer', vendors:'vendor', employees:'employee' };
function describe(col, o){
  if(!o) return '';
  if(LOG_NAME[col]) return `${LOG_NAME[col]} “${o.name}”${col === 'users' && o.role ? ` (${ROLE_LABEL[o.role]})` : ''}`;
  if(col === 'movements') return `${TYPE_LABEL[o.type] || o.type} · ${o.productName} · ${num(o.qty)}`;
  if(col === 'invoices') return `bill ${o.no} · ${o.customer?.name} · ${money(o.total)}${o.cancelled ? ' (cancelled)' : ''}`;
  if(col === 'payments') return `receipt ${money(o.amount)} · ${o.invoiceNo} · ${o.customerName}`;
  if(col === 'purchases') return `purchase · ${o.vendorName} · ${money(o.total)}`;
  if(col === 'transactions') return { expense:`expense ${o.category} · ${money(o.amount)}`, vendor_payment:`vendor payment ${o.vendorName} · ${money(o.amount)}`,
    income:`income ${money(o.amount)}`, transfer:`transfer ${o.from} → ${o.to} · ${money(o.amount)}`, salary:`salary ${o.empName} · ${monthName(o.month)} · ${money(o.amount)}`,
    advance:`advance ${o.empName} · ${money(o.amount)}` }[o.type] || o.type;
  return col;
}
async function logActivity(verb, col, obj){
  if(!ME || LOG_SKIP.has(col)) return;
  if(col === 'movements' && (obj?.invoiceId || obj?.purchaseId)) return; // covered by the bill/purchase entry
  const action = verb === 'add' ? 'Added' : verb === 'update' ? (col === 'invoices' && obj?.cancelled ? 'Cancelled' : 'Edited') : 'Deleted';
  await logEvent(action, describe(col, obj));
}
let _logQ = Promise.resolve();
function logEvent(action, detail){
  if(!ME) return Promise.resolve();
  const by = { id:ME.id, name:ME.name };
  return _logQ = _logQ.then(() => writeLog(action, detail, by));
}
async function writeLog(action, detail, by){
  try{
    const log = await DB.list('activity');
    log.push({ id:uid(), at:Date.now(), by:by.id, byName:by.name, action, detail });
    await DB.saveAll('activity', log.slice(-1500));
  }catch(e){}
}

/* =========================================================
   SETTINGS
   ========================================================= */
async function renderSettings(){
  const theme = document.documentElement.dataset.theme;
  let html = `
  <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
    <div>
      <div class="card"><h3>👤 My Account</h3>
        <div class="list-item"><div class="avatar">${initials(ME.name)}</div><div class="grow"><b>${esc(ME.name)}</b><div class="muted">${ROLE_LABEL[ME.role]} · Login ID: <b>${esc(loginIdOf(ME))}</b></div></div></div>
        <button class="btn ghost block" onclick="changePinModal()">🔑 Change My Password</button>
      </div>
      <div class="card"><h3>🎨 Appearance</h3>
        <div class="tabs"><button class="${theme === 'light' ? 'on' : ''}" onclick="setTheme('light');renderSettings()">☀️ Light</button>
        <button class="${theme === 'dark' ? 'on' : ''}" onclick="setTheme('dark');renderSettings()">🌙 Dark</button></div>
      </div>`;
  if(isMgr()) html += `
      <div class="card"><h3>☁️ Cloud & This Device</h3>
        <div class="sumline"><span>Status</span><span>${Cloud.error ? '⚠️ ' + esc(Cloud.error) : navigator.onLine ? '☁️ Connected' : '📴 Offline'}</span></div>
        <p class="muted">Changes sync to every phone and PC using the app. Offline changes are kept on the device and sent when you're back online.</p>
      </div>
      <div class="card"><h3>💾 Backup & Restore</h3>
        <p class="muted">Download all data as a file, or restore from a backup (an offline copy in case anything goes wrong).</p>
        <div class="quick" style="margin-top:12px">
          <button class="btn" onclick="exportBackup()">⬇️ Download Backup</button>
          <button class="btn ghost" onclick="$('#restoreFile').click()">⬆️ Restore</button>
          <input type="file" id="restoreFile" accept=".json" class="hidden" onchange="importBackup(this)">
        </div>
      </div>`;
  html += `</div><div>`;
  if(isAdmin()){
    const s = SETTINGS;
    html += `
      <div class="card"><h3>🏢 Company Details</h3>
        <label>Company Name</label><input id="cName" value="${esc(s.companyName)}">
        <div class="row2">
          <div><label>Phone</label><input id="cPhone" inputmode="tel" value="${esc(s.phone)}"></div>
          <div><label>Email</label><input id="cEmail" type="email" value="${esc(s.email)}"></div>
        </div>
        <label>Address</label><input id="cAddr" value="${esc(s.address)}">
        <div class="row2">
          <div><label>GSTIN</label><input id="cGst" value="${esc(s.gstin)}" style="text-transform:uppercase"></div>
          <div><label>State</label><input id="cState" value="${esc(s.state)}"></div>
        </div>
        <button class="btn block" onclick="saveCompany()">Save Company Details</button>
      </div>
      <div class="card"><h3>🧾 Invoice Settings</h3>
        <label>Bill number prefix <span class="muted">({FY} becomes e.g. 26-27)</span></label><input id="iPrefix" value="${esc(s.invPrefix || 'SRS/{FY}/')}">
        <label style="display:flex;align-items:center;gap:8px;margin-top:12px"><input id="iIncl" type="checkbox" style="width:auto" ${s.pricesIncludeGst ? 'checked' : ''}> Sale prices already include GST</label>
        <label>UPI ID (shows a pay QR on bills)</label><input id="iUpi" value="${esc(s.upiId)}" placeholder="e.g. sunrise@upi">
        <div class="row2">
          <div><label>Bank Name</label><input id="iBank" value="${esc(s.bankName)}"></div>
          <div><label>IFSC</label><input id="iIfsc" value="${esc(s.bankIfsc)}" style="text-transform:uppercase"></div>
        </div>
        <label>Account Number</label><input id="iAcc" inputmode="numeric" value="${esc(s.bankAcc)}">
        <label>Terms & Conditions</label><textarea id="iTerms" rows="3" placeholder="e.g. Goods once sold will not be taken back.">${esc(s.terms)}</textarea>
        <button class="btn block" onclick="saveInvoiceSettings()">Save Invoice Settings</button>
      </div>
      <div class="card"><h3>👥 Users & Logins <button class="btn sm" onclick="userModal()">➕ Add User</button></h3><div id="userList"></div></div>`;
  }
  html += `</div></div>`;
  $('#main').innerHTML = html;
  if(isAdmin()) renderUsers();
}

async function saveCompany(){
  const name = $('#cName').value.trim(); if(!name) return toast('Company name required');
  SETTINGS = { ...SETTINGS, companyName:name, phone:$('#cPhone').value.trim(), email:$('#cEmail').value.trim(),
    address:$('#cAddr').value.trim(), gstin:$('#cGst').value.trim().toUpperCase(), state:$('#cState').value.trim() };
  await DB.setDoc('settings', SETTINGS);
  $('#brandName').innerHTML = `${esc(name)}<small>Business Manager</small>`;
  toast('Company details saved');
}

async function renderUsers(){
  const users = (await DB.list('users')).sort((a,b) => ({ admin:0, owner:1, employee:2 }[a.role] - { admin:0, owner:1, employee:2 }[b.role]) || a.name.localeCompare(b.name));
  $('#userList').innerHTML = users.map(u => `
    <div class="list-item">
      <div class="avatar" style="width:32px;height:32px;font-size:12px;${u.active === false ? 'opacity:.4' : ''}">${initials(u.name)}</div>
      <div class="grow"><b>${esc(u.name)}</b>${u.id === ME.id ? ' <span class="muted">(you)</span>' : ''}<div class="muted">ID: ${esc(loginIdOf(u))}</div>
        <span class="badge ${u.role}">${ROLE_LABEL[u.role]}</span> ${u.active === false ? '<span class="badge off">Disabled</span>' : ''}</div>
      ${u.id !== ME.id ? `
        <button class="icon-btn" title="Edit / reset password" onclick="userModal('${u.id}')">✏️</button>
        <button class="icon-btn" title="${u.active === false ? 'Enable' : 'Disable'}" onclick="toggleUser('${u.id}')">${u.active === false ? '✅' : '⛔'}</button>
        <button class="icon-btn" title="Delete" onclick="deleteUser('${u.id}')">🗑️</button>` : ''}
    </div>`).join('');
}

async function userModal(id){
  const u = id ? (await DB.list('users')).find(x => x.id === id) : null;
  const roles = u?.role === 'admin' ? ['admin','owner','employee'] : ['owner','employee'];
  openModal(u ? 'Edit User' : 'Add User', `
    <label>Full Name</label><input id="uName" value="${esc(u?.name)}">
    <label>Login ID</label><input id="uId" autocapitalize="none" value="${esc(u ? loginIdOf(u) : '')}" placeholder="e.g. ravi">
    <label>Role</label>
    <select id="uRole">${roles.map(r => `<option value="${r}" ${(u?.role || 'employee') === r ? 'selected' : ''}>${ROLE_LABEL[r]}</option>`).join('')}</select>
    <label>${u ? 'New Password (leave blank to keep)' : 'Password (min 6 characters)'}</label>
    ${pwField('uPass')}
    <p class="muted" style="margin-top:8px">Give this Login ID and password to the person. They can change the password later in Settings.</p>
    <button class="btn block" onclick="saveUser('${id || ''}')">${u ? 'Save Changes' : 'Create User'}</button>`);
}
async function saveUser(id){
  const name = $('#uName').value.trim(), loginId = cleanId($('#uId').value), role = $('#uRole').value, pass = $('#uPass').value;
  if(!name) return toast('Enter a name');
  if(!validId(loginId)) return toast(ID_RULE);
  const users = await DB.list('users');
  if(users.some(x => x.id !== id && loginIdOf(x) === loginId)) return toast('This Login ID is already taken');
  if(role === 'admin' && users.some(x => x.role === 'admin' && x.id !== id)) return toast('There can be only one Admin');
  if(id){
    const patch = { name, loginId, role };
    if(pass){ if(!validPass(pass)) return toast(PASS_RULE); patch.pinHash = await hashPin(pass); }
    await DB.update('users', id, patch); toast(pass ? 'User updated — new password set' : 'User updated');
  } else {
    if(!validPass(pass)) return toast(PASS_RULE);
    await DB.add('users', { name, loginId, role, pinHash: await hashPin(pass), active:true, createdAt: Date.now() }); toast(`User created — Login ID: ${loginId}`);
  }
  closeModal(); renderUsers();
}
async function toggleUser(id){
  const u = (await DB.list('users')).find(x => x.id === id);
  await DB.update('users', id, { active: u.active === false }); renderUsers();
}
async function deleteUser(id){
  if(!confirm('Delete this user permanently? Their past entries will stay.')) return;
  await DB.remove('users', id); renderUsers(); toast('User deleted');
}

function changePinModal(){
  openModal('My Login Details', `
    <label>Login ID</label><input id="pId" autocapitalize="none" value="${esc(loginIdOf(ME))}">
    <label>Current Password</label>${pwField('pOld')}
    <label>New Password <span class="muted">(leave blank to keep)</span></label>${pwField('pNew')}
    <label>Confirm New Password</label>${pwField('pNew2')}
    <button class="btn block" onclick="changePin()">Save</button>`);
}
async function changePin(){
  if(ME.pinHash !== await hashPin($('#pOld').value)) return toast('Current password is wrong');
  const loginId = cleanId($('#pId').value), p = $('#pNew').value, patch = { loginId };
  if(!validId(loginId)) return toast(ID_RULE);
  if((await DB.list('users')).some(x => x.id !== ME.id && loginIdOf(x) === loginId)) return toast('This Login ID is already taken');
  if(p){
    if(!validPass(p)) return toast(PASS_RULE);
    if(p !== $('#pNew2').value) return toast('Passwords do not match');
    patch.pinHash = await hashPin(p);
  }
  Object.assign(ME, patch);
  await DB.update('users', ME.id, patch);
  closeModal(); toast('Login details saved');
}

async function exportBackup(){
  const data = await DB.exportAll();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type:'application/json' }));
  a.download = `sunrise-backup-${todayStr()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  await DB.setDoc('backupInfo', { lastBackup: Date.now() });
  toast('Backup downloaded');
}
function importBackup(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try{
      const data = JSON.parse(r.result);
      if(data.app !== 'sunrise-solar') throw 0;
      if(!confirm('Restore will REPLACE all current data in the cloud for every device. Continue?')) return;
      await DB.importAll(data); await logEvent('Restored backup', f.name); toast('Backup restored ✅');
      SETTINGS = await DB.getDoc('settings') || {};
      const u = (await DB.list('users')).find(x => x.id === ME.id);
      if(u){ ME = u; startApp(); } else { ME = null; showLogin(); }
    }catch(e){ toast('Invalid backup file'); }
  };
  r.readAsText(f); input.value = '';
}

init();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

</script>
