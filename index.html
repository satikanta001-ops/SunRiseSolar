<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f59e0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sun Rise Solar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f59e0b'/%3E%3Cstop offset='1' stop-color='%23ea580c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ccircle cx='50' cy='50' r='18' fill='%23fff'/%3E%3Cg stroke='%23fff' stroke-width='6' stroke-linecap='round'%3E%3Cpath d='M50 14v10M50 76v10M14 50h10M76 50h10M25 25l7 7M68 68l7 7M75 25l-7 7M32 68l-7 7'/%3E%3C/g%3E%3C/svg%3E">
<title>Sun Rise Solar</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ef; --card:#ffffff; --ink:#2b2118; --muted:#8a7a6a; --line:#f1e4d3; --soft:#fff3e2;
  --sun:#f59e0b; --sun2:#ea580c; --danger:#dc2626; --ok:#16a34a; --shadow:0 4px 14px rgba(60,30,0,.06);
}
html[data-theme="dark"]{
  --bg:#15110c; --card:#211912; --ink:#f6ede3; --muted:#a89683; --line:#3a2d21; --soft:#2b2117; --shadow:0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px}
button{font:inherit;cursor:pointer}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;font:inherit;font-size:15px;background:var(--bg);color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--sun)}
label{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px}
.hidden{display:none!important}

/* Buttons */
.btn{padding:11px 16px;border:none;border-radius:11px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--sun),var(--sun2))}
.btn.block{width:100%;margin-top:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--danger)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.icon-btn{border:none;background:none;padding:6px;font-size:15px;border-radius:8px}
.icon-btn:hover{background:var(--soft)}

/* Auth screens */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 50% -10%,rgba(245,158,11,.35),transparent 60%),var(--bg)}
.auth-card{background:var(--card);width:100%;max-width:380px;border-radius:22px;padding:28px 22px;box-shadow:0 10px 40px rgba(120,60,0,.12)}
.logo{width:84px;height:84px;border-radius:22%;margin:0 auto 12px;overflow:hidden;box-shadow:0 8px 24px rgba(234,88,12,.35)}
.srs-logo{width:100%;height:100%;display:block}
.srs-logo .rays{transform-origin:50px 54px}
.srs-logo .glow{transform-origin:50px 54px}
.srs-logo.anim .rays{animation:srsSpin 16s linear infinite}
.srs-logo.anim .glow{animation:srsPulse 3s ease-in-out infinite}
.srs-logo.anim .sunup{animation:srsRise 1.6s cubic-bezier(.2,.8,.2,1) both}
.srs-logo.anim .shine{animation:srsShine 3.4s ease-in-out 1.2s infinite}
@keyframes srsSpin{to{transform:rotate(360deg)}}
@keyframes srsPulse{0%,100%{transform:scale(.88);opacity:.55}50%{transform:scale(1.08);opacity:1}}
@keyframes srsRise{from{transform:translateY(22px)}to{transform:translateY(0)}}
@keyframes srsShine{0%{transform:translateX(-40px)}55%,100%{transform:translateX(120px)}}
@media (prefers-reduced-motion:reduce){.srs-logo.anim *{animation:none!important}}
.auth-card h1{text-align:center;font-size:20px}
.auth-card p.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:6px}

/* App layout */
#app{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--card);border-right:1px solid var(--line);position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.brand .logo{width:42px;height:42px;margin:0;flex-shrink:0;box-shadow:0 4px 12px rgba(234,88,12,.3)}
.brand b{font-size:15px;line-height:1.2}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.side-nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--ink);text-decoration:none;margin-bottom:3px;font-weight:500}
.side-nav a:hover{background:var(--soft)}
.side-nav a.on{background:linear-gradient(135deg,var(--sun),var(--sun2));color:#fff}
.side-user{margin-top:auto;padding:12px;background:var(--soft);border-radius:12px;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--sun),var(--sun2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.side-user .who{flex:1;min-width:0}
.side-user .who b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user .who span{font-size:11px;color:var(--muted)}
.content{flex:1;margin-left:240px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;position:sticky;top:0;background:var(--bg);z-index:5}
.topbar h2{font-size:20px}
.topbar .mob-user{display:none}
main{padding:0 28px 40px}
.bottomnav{display:none}

/* Cards & grids */
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.stat{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);border-left:4px solid var(--sun)}
.stat span{font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:24px;font-weight:700;margin-top:2px}
.grid2{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.grid2 > .sticky{position:sticky;top:76px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:flex;gap:10px;flex-wrap:wrap}

/* Tabs */
.tabs{display:inline-flex;gap:4px;background:var(--soft);padding:4px;border-radius:11px}
.tabs button{border:none;background:none;padding:7px 14px;border-radius:8px;color:var(--muted);font-size:13px}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{max-width:260px}
.toolbar select{width:auto}
.tabs button:disabled{cursor:default}
.badge.ok{background:#dcfce7;color:#15803d}
.badge.low{background:#fef3c7;color:#b45309}
.badge.out{background:#fee2e2;color:#b91c1c}

/* Tables (turn into cards on phone) */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:10px;border-bottom:1.5px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right}
.qty{font-weight:700;color:var(--sun2)}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--soft);color:var(--sun2)}
.badge.admin{background:#fee2e2;color:#b91c1c}
.badge.owner{background:#dbeafe;color:#1d4ed8}
.badge.off{background:var(--line);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 0;font-size:13px}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border:none}
.list-item .grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:12px}
.soon{text-align:center;padding:50px 20px}
.soon .big{font-size:48px}
.soon h3{justify-content:center;font-size:18px;margin-top:8px}

/* Billing */
.bill-grid{grid-template-columns:1fr 330px}
.view-grid{grid-template-columns:1fr 300px}
.inv-head,.inv-row{display:grid;grid-template-columns:minmax(0,2.6fr) .8fr 1fr .7fr .8fr 1fr 34px;gap:8px;align-items:start}
.inv-head{font-size:12px;color:var(--muted);padding-bottom:6px;border-bottom:1.5px solid var(--line)}
.inv-row{padding:10px 0;border-bottom:1px solid var(--line)}
.inv-row input,.inv-row select{padding:9px 8px;font-size:14px}
.inv-row .amt{padding-top:10px;text-align:right;font-weight:600}
.inv-row .lbl{display:none}
.inv-row .muted{margin-top:3px}
.sumline{display:flex;justify-content:space-between;padding:5px 0}
.sumline.total{font-size:17px;font-weight:700;border-top:1.5px solid var(--line);margin-top:6px;padding-top:10px}
.warn{color:var(--danger)!important;font-weight:600}
.paper-wrap{overflow-x:auto;min-width:0}
.paper{background:#fff;color:#222;padding:28px;border-radius:10px;box-shadow:var(--shadow);font-size:12px;line-height:1.5;position:relative;min-width:640px;overflow:hidden}
.paper .ph{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid #f59e0b;padding-bottom:12px}
.paper .co{font-size:20px;font-weight:700;color:#ea580c}
.paper .doc{font-size:16px;font-weight:700;letter-spacing:1px}
.paper .pbill{padding:12px 0}
.paper .muted2{color:#888;font-size:11px}
.paper table.pt th{background:#fff7ed;color:#555;font-size:11px;padding:6px;border-bottom:1px solid #f3d9b8}
.paper table.pt td{padding:6px;border-bottom:1px solid #eee}
.paper table.pt .r{text-align:right}
.paper table.small{margin-top:8px;max-width:340px}
.paper .pfoot{display:flex;justify-content:space-between;gap:20px;margin-top:12px}
.paper .pleft{flex:1}
.paper .ptot{width:240px}
.paper .ptot div{display:flex;justify-content:space-between;padding:3px 0}
.paper .ptot .grand{font-size:15px;font-weight:700;border-top:2px solid #222;border-bottom:2px solid #222;margin:4px 0;padding:6px 0}
.paper .pbank{display:flex;gap:12px;align-items:center;margin-top:12px;padding:10px;border:1px dashed #ddd;border-radius:8px}
.paper .pnote{margin-top:10px;font-size:11px}
.paper .psign{display:flex;justify-content:space-between;margin-top:36px;font-size:11px}
.paper .pthanks{text-align:center;margin-top:16px;color:#888}
.paper .watermark{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-25deg);font-size:80px;font-weight:700;color:rgba(220,38,38,.12);pointer-events:none}
#printArea{display:none}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}
  #app,#auth,#modal,#toast{display:none!important}
  #printArea{display:block!important}
  #printArea .paper{box-shadow:none;padding:0;min-width:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* Accounts */
.acc-tabs{display:flex;margin-bottom:14px;overflow-x:auto;max-width:100%}
.acc-tabs button{white-space:nowrap}
.inv-head.pe,.inv-row.pe{grid-template-columns:minmax(0,2.6fr) .8fr 1.1fr .8fr 1fr 34px}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--sun2));border-radius:6px}

/* HR */
.att-btns{display:flex;gap:4px}
.att{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-weight:700;font-size:13px}
.att.on.P{background:#16a34a;border-color:#16a34a;color:#fff}
.att.on.A{background:#dc2626;border-color:#dc2626;color:#fff}
.att.on.H{background:#f59e0b;border-color:#f59e0b;color:#fff}
.att.on.L{background:#2563eb;border-color:#2563eb;color:#fff}
.att.on.O{background:#78716c;border-color:#78716c;color:#fff}
.reg-wrap{overflow-x:auto}
table.reg{font-size:12px;border-collapse:separate;border-spacing:0}
table.reg th,table.reg td{padding:3px 1px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
table.reg th small{color:var(--muted);font-weight:400}
table.reg th.sun{color:var(--danger)}
table.reg .sticky-col{position:sticky;left:0;background:var(--card);text-align:left;padding:4px 10px 4px 0;z-index:1;min-width:110px}
table.reg .sticky-col a{color:var(--ink);font-weight:600;text-decoration:none}
.cell{display:inline-flex;width:20px;height:20px;border-radius:6px;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--soft);color:transparent}
.cell.P,.cal-d.P{background:#dcfce7;color:#15803d}
.cell.A,.cal-d.A{background:#fee2e2;color:#b91c1c}
.cell.H,.cal-d.H{background:#fef3c7;color:#b45309}
.cell.L,.cal-d.L{background:#dbeafe;color:#1d4ed8}
.cell.O,.cal-d.O{background:#e7e5e4;color:#57534e}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal-h{font-size:11px;color:var(--muted)}
.cal-d{padding:8px 0;border-radius:8px;background:var(--soft);font-size:13px;font-weight:600}

/* Reports & chart */
.rep-grid{grid-template-columns:210px 1fr}
.rep-menu{padding:10px;display:flex;flex-direction:column;gap:2px}
.rep-menu button{border:none;background:none;text-align:left;padding:9px 10px;border-radius:9px;color:var(--ink);font-size:13px}
.rep-menu button:hover{background:var(--soft)}
.rep-menu button.on{background:linear-gradient(135deg,var(--sun),var(--sun2));color:#fff;font-weight:600}
.rep-scroll{overflow-x:auto}
table.rep{font-size:13px}
table.rep th,table.rep td{white-space:nowrap}
table.rep tfoot td{border-top:1.5px solid var(--line);border-bottom:none}
.chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart .b{width:100%;max-width:34px;background:linear-gradient(180deg,var(--sun),var(--sun2));border-radius:6px 6px 2px 2px;opacity:.75}
.chart .b.today{opacity:1}
.chart small{font-size:10px;color:var(--muted)}
.rp{font-family:Poppins,sans-serif;color:#222;font-size:11px}
.rp h2{font-size:18px;color:#ea580c}.rp h3{font-size:13px;margin:2px 0 8px}
.rp table{width:100%;border-collapse:collapse}
.rp th{background:#fff7ed;text-align:left;padding:5px;border-bottom:1px solid #f3d9b8}
.rp td{padding:4px 5px;border-bottom:1px solid #eee}
.rp .r{text-align:right}.rp tfoot td{border-top:1.5px solid #222}
.rp .small{color:#888;margin-top:10px}

/* Cloud */
.top-right{display:flex;align-items:center;gap:10px}
.sync{border:none;border-radius:20px;padding:5px 11px;font-size:11px;font-weight:600;background:var(--soft);color:var(--muted);white-space:nowrap}
.sync.ok{color:var(--ok)}.sync.warn{color:#b45309;background:#fef3c7}.sync.bad{color:#b91c1c;background:#fee2e2}
.sync.new{color:#fff;background:linear-gradient(135deg,var(--sun),var(--sun2))}
.spinner{width:30px;height:30px;margin:16px auto 4px;border:3px solid var(--line);border-top-color:var(--sun2);border-radius:50%;animation:srsSpin 1s linear infinite}

/* Password fields */
.pw-wrap{position:relative}
.pw-wrap input{padding-right:44px}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:none;background:none;font-size:16px;padding:6px 8px}

/* Modal & toast */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.show{display:flex}
.modal-box{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.modal-head h3{font-size:16px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:30px;font-size:13px;transition:.3s;z-index:60}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ---------- Phone ---------- */
@media (max-width:900px){
  .sidebar{display:none}
  .content{margin-left:0}
  .topbar{padding:14px 16px}
  .topbar h2{font-size:18px}
  .topbar .mob-user{display:flex;align-items:center;gap:6px}
  .top-right{gap:6px}
  .sync{font-size:10px;padding:4px 8px}
  main{padding:0 16px 96px}
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stat b{font-size:20px}
  .grid2{grid-template-columns:1fr}
  .grid2 > .sticky{position:static}
  .toolbar input{max-width:none}
  .toolbar > .quick{width:100%}
  .toolbar > .quick select{flex:1}
  .bill-grid,.view-grid{grid-template-columns:1fr}
  .view-grid > .sticky{order:-1}
  .inv-head{display:none}
  .inv-row{grid-template-columns:1fr 1fr 1fr;gap:6px 8px;padding:12px 0}
  .inv-row .c-prod{grid-column:1/-1}
  .inv-row.pe{grid-template-columns:1fr 1fr 1fr}
  .inv-row .lbl{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
  .inv-row .amt{padding-top:22px;text-align:left}
  .inv-row > .icon-btn{margin-top:18px;justify-self:end}
  .paper{padding:18px}
  .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -4px 14px rgba(0,0,0,.05)}
  .bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:10px;padding:4px 0;border-radius:10px}
  .bottomnav a .ic{font-size:19px}
  .bottomnav a.on{color:var(--sun2);font-weight:600;background:var(--soft)}
  /* tables become cards */
  table.resp thead{display:none}
  table.resp tr{display:block;padding:10px 0;border-bottom:1px solid var(--line)}
  table.resp tr:last-child{border:none}
  table.resp td{display:flex;justify-content:space-between;align-items:center;border:none;padding:3px 0;text-align:right}
  table.resp td::before{content:attr(data-label);color:var(--muted);font-size:12px;text-align:left;padding-right:10px}
  table.resp td.title{font-weight:600;font-size:15px;justify-content:flex-start;text-align:left}
  table.resp td.title::before{display:none}
  table.resp td:empty{display:none}
  .acc-tabs{scrollbar-width:none}
  .rep-grid{grid-template-columns:1fr}
  #repBody .card > h3{flex-wrap:wrap}
  #repBody .card > h3 .quick{width:100%}
  #repBody .toolbar > .quick{display:grid;grid-template-columns:1fr auto 1fr;width:100%}
  #repBody .toolbar > .quick input[type=date]{width:100%!important;min-width:0}
  #repBody .toolbar > .quick select{grid-column:1/-1;width:100%!important}
  .bottomnav a{font-size:9px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .bottomnav a .ic{font-size:18px}
  .rep-menu{flex-direction:row;overflow-x:auto;padding:6px;scrollbar-width:none}
  .rep-menu button{white-space:nowrap}
  table.rep{font-size:14px}
  table.rep th,table.rep td{white-space:normal}
  table.rep tfoot tr{display:block;border-top:1.5px solid var(--line);padding-top:8px}
  table.rep tfoot td{border:none}
  .chart{gap:3px}
  .att-row{flex-wrap:wrap}
  .att-row .att-btns{width:100%;justify-content:space-between}
  .att{flex:1;height:38px}
}
</style>
</head>
<body>

<div id="auth" class="hidden"></div>

<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand"><div class="logo" id="brandLogo"></div><b id="brandName">Sun Rise Solar<small>Business Manager</small></b></div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-user">
      <div class="avatar" id="sideAvatar"></div>
      <div class="who"><b id="sideName"></b><span id="sideRole"></span></div>
      <button class="icon-btn" title="Logout" onclick="logout()">🚪</button>
    </div>
  </aside>
  <div class="content">

<script>
/* =========================================================
   DATA LAYER — Firebase Firestore with a live local mirror.
   Every collection is kept in memory by real-time listeners,
   so reads are instant and work offline. Writes update the
   mirror at once and are sent to Firestore in the background
   (Firestore queues them while offline and syncs later).
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyAegjhZsowCpQN2vF6igTA0N4uJX3WcCd0",
  authDomain: "sun-rise-solar.firebaseapp.com",
  projectId: "sun-rise-solar",
  storageBucket: "sun-rise-solar.firebasestorage.app",
  messagingSenderId: "344570446747",
  appId: "1:344570446747:web:c81e0b953df459c76b173e"
};
const FB_VERSIONS = ['13.1.0', '11.0.0'];
const Cloud = { cache:{}, docs:{}, fs:null, A:null, db:null, auth:null, user:null, unsubs:[], pending:0, stale:false, error:'' };
const LOCAL_ONLY = new Set(['stock']); // Phase 1 leftovers, only used while importing old backups

const clean = o => JSON.parse(JSON.stringify(o ?? null));
function stable(v){
  if(Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if(v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v);
}

async function loadFirebase(){
  let last;
  for(const v of FB_VERSIONS){
    try{
      const base = `https://www.gstatic.com/firebasejs/${v}/`;
      const [app, auth, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
      return { app, auth, fs };
    }catch(e){ last = e; }
  }
  throw last;
}
Cloud.start = async function(){
  const sdk = await loadFirebase();
  const app = sdk.app.initializeApp(firebaseConfig);
  Cloud.fs = sdk.fs; Cloud.A = sdk.auth;
  try{ Cloud.db = sdk.fs.initializeFirestore(app, { localCache: sdk.fs.persistentLocalCache({ tabManager: sdk.fs.persistentMultipleTabManager() }) }); }
  catch(e){ Cloud.db = sdk.fs.getFirestore(app); }
  Cloud.auth = sdk.auth.getAuth(app);
  return new Promise(res => {
    let first = true;
    sdk.auth.onAuthStateChanged(Cloud.auth, u => {
      Cloud.user = u;
      if(first){ first = false; res(u); return; }
      if(!u) connectSilently().catch(() => {});
    });
  });
};
function attachCloud(){
  detachCloud();
  const { collection, onSnapshot } = Cloud.fs;
  const names = [...DB.COLLECTIONS.filter(c => !LOCAL_ONLY.has(c)), 'docs'];
  return Promise.all(names.map(col => new Promise(res => {
    let first = true;
    Cloud.unsubs.push(onSnapshot(collection(Cloud.db, col), snap => {
      const rows = snap.docs.map(d => ({ ...d.data(), id:d.id }));
      if(col === 'docs') Cloud.docs = Object.fromEntries(rows.map(r => [r.id, r])); else Cloud.cache[col] = rows;
      Cloud.error = ''; syncState();
      if(first){ first = false; res(); return; }
      if(snap.docChanges().some(c => !c.doc.metadata.hasPendingWrites)) remoteChanged(col);
    }, err => {
      console.error('Sync error', col, err);
      Cloud.error = err.code || 'error'; syncState();
      if(first){ first = false; res(); }
    }));
  })));
}
function detachCloud(){ Cloud.unsubs.forEach(u => { try{ u(); }catch(e){} }); Cloud.unsubs = []; }

function commit(ops){
  if(!ops.length) return;
  const { writeBatch, doc } = Cloud.fs;
  for(let i = 0; i < ops.length; i += 450){
    const b = writeBatch(Cloud.db);
    ops.slice(i, i + 450).forEach(o => { const ref = doc(Cloud.db, o.col, o.id); o.del ? b.delete(ref) : b.set(ref, o.data); });
    Cloud.pending++; syncState();
    b.commit().then(() => { Cloud.pending--; syncState(); })
      .catch(e => { Cloud.pending--; Cloud.error = e.code || 'error'; syncState(); toast('⚠️ Not saved to cloud: ' + (e.code || e.message)); });
  }
}

const DB = {
  COLLECTIONS: ['users', 'products', 'movements', 'customers', 'invoices', 'payments', 'vendors', 'purchases', 'transactions', 'employees', 'attendance', 'activity', 'stock'],
  DOCS: ['settings'],
  async list(col){ return clean(Cloud.cache[col] || []); },
  async saveAll(col, arr){
    const next = clean(arr), ops = [];
    if(!LOCAL_ONLY.has(col)){
      const old = new Map((Cloud.cache[col] || []).map(x => [x.id, x])), seen = new Set();
      next.forEach(x => { if(!x.id) x.id = uid(); seen.add(x.id); const o = old.get(x.id); if(!o || stable(o) !== stable(x)) ops.push({ col, id:x.id, data:x }); });
      old.forEach((_, id) => { if(!seen.has(id)) ops.push({ col, id, del:true }); });
    }
    Cloud.cache[col] = next; commit(ops);
  },
  async add(col, obj){
    obj.id = obj.id || uid();
    const d = clean(obj); (Cloud.cache[col] = Cloud.cache[col] || []).push(d);
    if(!LOCAL_ONLY.has(col)) commit([{ col, id:d.id, data:d }]);
    logActivity('add', col, d); return obj;
  },
  async update(col, id, patch){
    const a = Cloud.cache[col] || [], i = a.findIndex(x => x.id === id);
    if(i > -1){ a[i] = clean({ ...a[i], ...patch }); commit([{ col, id, data:a[i] }]); logActivity('update', col, a[i]); }
  },
  async remove(col, id){
    const a = Cloud.cache[col] || [], gone = a.find(x => x.id === id);
    Cloud.cache[col] = a.filter(x => x.id !== id);
    commit([{ col, id, del:true }]); if(gone) logActivity('remove', col, gone);
  },
  async getDoc(name){ const d = Cloud.docs[name]; if(!d) return null; const c = clean(d); delete c.id; return c; },
  async setDoc(name, obj){ const d = clean({ ...obj, id:name }); Cloud.docs[name] = d; commit([{ col:'docs', id:name, data:d }]); },
  async exportAll(){
    const out = { app:'sunrise-solar', version:2, exportedAt:new Date().toISOString(), collections:{}, docs:{} };
    for(const c of this.COLLECTIONS) if(!LOCAL_ONLY.has(c)) out.collections[c] = await this.list(c);
    for(const d of this.DOCS) out.docs[d] = await this.getDoc(d);
    return out;
  },
  async importAll(data){
    for(const c of this.COLLECTIONS) await this.saveAll(c, Array.isArray(data.collections?.[c]) ? data.collections[c] : []);
    for(const d of this.DOCS) if(data.docs?.[d]) await this.setDoc(d, data.docs[d]);
    await migrateLegacy();
  }
};

/* Data saved by the on-device version of the app (before the cloud) */
function deviceData(){
  try{
    if(!localStorage.getItem('srs_users')) return null;
    const out = { app:'sunrise-solar', collections:{}, docs:{} };
    DB.COLLECTIONS.forEach(c => { const v = localStorage.getItem('srs_' + c); if(v) out.collections[c] = JSON.parse(v); });
    const s = localStorage.getItem('srs_doc_settings'); if(s) out.docs.settings = JSON.parse(s);
    return out;
  }catch(e){ return null; }
}

/* ---------- Sync status & live refresh ---------- */
function syncState(){
  const el = $('#syncPill'); if(!el) return;
  let t, cls = '';
  if(Cloud.error){ t = '⚠️ Sync problem'; cls = 'bad'; }
  else if(!navigator.onLine){ t = '📴 Offline · saved on device'; cls = 'warn'; }
  else if(Cloud.pending > 0){ t = '⏳ Saving…'; }
  else if(Cloud.stale){ t = '🔄 New updates — tap'; cls = 'new'; }
  else { t = '☁️ Synced'; cls = 'ok'; }
  el.textContent = t; el.className = 'sync ' + cls;
  el.title = Cloud.error ? 'Error: ' + Cloud.error : '';
}
window.addEventListener('online', syncState);
window.addEventListener('offline', syncState);
function syncPillClick(){
  if(Cloud.stale){ Cloud.stale = false; refreshView(); }
  else if(Cloud.error) toast('Sync error: ' + Cloud.error + '. Check internet and the Firestore rules.');
}
function isBusy(){
  return $('#modal').classList.contains('show') || /billing\/(new|edit)|purchase\/new/.test(location.hash)
    || ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName);
}
function refreshView(){ const y = window.scrollY; route(); setTimeout(() => window.scrollTo(0, y), 120); syncState(); }
let _remoteT;
function remoteChanged(col){
  if(col === 'docs'){ SETTINGS = (Cloud.docs.settings ? (({ id, ...r }) => r)(clean(Cloud.docs.settings)) : SETTINGS); }
  if(ME && col === 'users'){
    const u = (Cloud.cache.users || []).find(x => x.id === ME.id);
    if(!u || u.active === false){ ME = null; try{ localStorage.removeItem('srs_session'); }catch(e){} toast('Your login was disabled or removed'); showLogin(); return; }
    ME = clean(u);
  }
  clearTimeout(_remoteT);
  _remoteT = setTimeout(() => {
    if(!ME) return;
    if(isBusy()){ Cloud.stale = true; syncState(); } else { Cloud.stale = false; refreshView(); }
  }, 500);
}

/* ---------- Logo: "SRS" with a rising sun, turning rays, pulsing glow and a light sweep ---------- */

function setAppIcons(){
  const svg = logoSvg(false).replace('class="srs-logo "', '');
  const url = 'data:image/svg+xml,' + encodeURIComponent(svg);
  const fav = document.querySelector('link[rel=icon]'); if(fav) fav.href = url;

    c.getContext('2d').drawImage(img, 0, 0, 180, 180);
    let l = document.querySelector('link[rel=apple-touch-icon]');
    if(l && location.protocol.startsWith('http')) return; // hosted: use icon-192.png

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fmtDate = d => d ? new Date(d + 'T00:00').toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}) : '';
const num = n => Number(n || 0).toLocaleString('en-IN');
const initials = n => String(n || '?').trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase();
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2000); }
function openModal(title, body){ $('#modal').innerHTML = `<div class="modal-box"><div class="modal-head"><h3>${title}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>${body}</div>`; $('#modal').classList.add('show'); }
function closeModal(){ $('#modal').classList.remove('show'); $('#modal').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });

async function hashPin(pin){
  const text = 'srs-pin:' + pin;
  if(window.crypto?.subtle){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  }
  let h = 5381; for(const ch of text) h = ((h << 5) + h + ch.charCodeAt(0)) >>> 0; return 'f' + h.toString(16);
}
const validPass = p => typeof p === 'string' && p.length >= 6;
const PASS_RULE = 'Password must be at least 6 characters';
const cleanId = v => String(v || '').trim().toLowerCase();
const validId = v => /^[a-z0-9._-]{3,20}$/.test(v);
const ID_RULE = 'Login ID: 3–20 letters, numbers, dot, dash or underscore (no spaces)';
const loginIdOf = u => u.loginId || cleanId(u.name).replace(/\s+/g, '');
const pwField = (id, extra = '') => `<div class="pw-wrap"><input id="${id}" type="password" autocomplete="${id === 'liPass' || id === 'pOld' ? 'current-password' : 'new-password'}" ${extra}><button type="button" class="pw-eye" tabindex="-1" onclick="const i=$('#${id}');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'👁️':'🙈'">👁️</button></div>`;

}

/* ---------- Roles & pages ---------- */

const ALL = ['admin','owner','employee'];
const PAGES = [

  { id:'accounts',  label:'Accounts',  icon:'💰', roles:['admin','owner'] },
  { id:'hr',        label:'HR',        icon:'👥', roles:['admin','owner'] },
  { id:'me',        label:'My Work',   icon:'🗓️', roles:['employee'] },

let ME = null, SETTINGS = {};
const isMgr = () => ['admin','owner'].includes(ME.role);

async function init(){
  applyTheme();
  setAppIcons();
  showSplash('Connecting to the cloud…');
  try{ await Cloud.start(); }
  catch(e){
    console.error(e);
    return showSplash('Couldn’t load the cloud connection. Check your internet and reload.', true);
  }
  if(!Cloud.user){
    // Optional: if anonymous sign-in is off, carry on without it (open Firestore rules).
    try{ await connectSilently(); }catch(e){ console.warn('Anonymous sign-in skipped:', e.code || e); }
  }
  afterConnect();
}
/* Each device gets a silent, automatic cloud identity — no email or password screen. */
async function connectSilently(){
  await Cloud.A.signInAnonymously(Cloud.auth);
  Cloud.user = Cloud.auth.currentUser;
}
async function afterConnect(){
  showSplash('Loading your data…');
  await attachCloud();
  SETTINGS = await DB.getDoc('settings') || {};
  const users = await DB.list('users');
  if(!users.length){
    if(Cloud.error) return showSplash('The cloud refused access (' + Cloud.error + '). In the Firebase console open Firestore Database → Rules, set them to allow read, write: if true; then Publish and reload.', true);
    return showSetup();
  }
  let sid = null; try{ sid = localStorage.getItem('srs_session'); }catch(e){}
  const u = users.find(x => x.id === sid && x.active !== false);
  if(u){ ME = u; startApp(); } else showLogin();
  syncState();
}
function authScreen(html){

}
function showSplash(msg, isError){

    ${isError ? `<button class="btn block" onclick="location.reload()">Try again</button>` : '<div class="spinner"></div>'}`);
}

function showSetup(){
  const local = deviceData();
  const n = local ? Object.values(local.collections).reduce((a, v) => a + (Array.isArray(v) ? v.length : 0), 0) : 0;
  authScreen(`<h1>Welcome</h1><p class="sub">The cloud is empty. How do you want to start?</p>
    ${local && n ? `<div class="card" style="background:var(--soft);box-shadow:none;margin:10px 0">
      <b>📲 Data found on this device</b><p class="muted">${num(n)} records from the on-device version of the app.</p>
      <button class="btn block" onclick="moveDeviceData()">Move it to the cloud</button></div>` : ''}
    <div class="card" style="background:var(--soft);box-shadow:none;margin:10px 0">
      <b>💾 Restore a backup file</b><p class="muted">Use a backup downloaded from Settings.</p>
      <button class="btn ghost block" onclick="$('#setupFile').click()">Choose backup file</button>
      <input type="file" id="setupFile" accept=".json" class="hidden" onchange="setupRestore(this)"></div>
    <details ${local && n ? '' : 'open'} style="margin-top:6px"><summary style="cursor:pointer;font-weight:600">✨ Start fresh</summary>
      <label>Company Name</label><input id="suCo" value="Sun Rise Solar">
      <label>Your Name (Admin)</label><input id="suName" placeholder="Your name">
      <label>Login ID</label><input id="suId" autocapitalize="none" autocomplete="username" placeholder="e.g. satin">
      <label>Password <span class="muted">(min 6 characters)</span></label>${pwField('suPass')}
      <label>Confirm Password</label>${pwField('suPass2')}
      <button class="btn block" onclick="doSetup()">Create & Continue</button></details>`);
}
async function moveDeviceData(){
  const local = deviceData(); if(!local) return;
  if(!confirm('Copy all data from this device into the cloud?')) return;
  await DB.importAll(local);
  SETTINGS = await DB.getDoc('settings') || {};
  toast('Data moved to the cloud ✅');
  showLogin();
}
function setupRestore(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try{
      const data = JSON.parse(r.result); if(data.app !== 'sunrise-solar') throw 0;
      await DB.importAll(data); SETTINGS = await DB.getDoc('settings') || {};
      toast('Backup restored to the cloud ✅'); showLogin();
    }catch(e){ toast('Invalid backup file'); }
  };
  r.readAsText(f); input.value = '';
}

async function doSetup(){
  const co = $('#suCo').value.trim(), name = $('#suName').value.trim(), loginId = cleanId($('#suId').value), p1 = $('#suPass').value, p2 = $('#suPass2').value;
  if(!co || !name) return toast('Fill company and your name');
  if(!validId(loginId)) return toast(ID_RULE);
  if(!validPass(p1)) return toast(PASS_RULE);
  if(p1 !== p2) return toast('Passwords do not match');
  SETTINGS = { companyName: co };
  await DB.setDoc('settings', SETTINGS);
  const u = await DB.add('users', { name, loginId, role:'admin', pinHash: await hashPin(p1), active:true, createdAt: Date.now() });
  login(u);
}

async function showLogin(){
  $('#app').classList.add('hidden'); $('#auth').classList.remove('hidden');
  $('#auth').innerHTML = `
  <div class="auth-card">
    <div class="logo">${logoSvg()}</div>

    <input id="liId" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" placeholder="Your login ID" onkeydown="if(event.key==='Enter')$('#liPass').focus()">
    <label>Password</label>

    <p class="muted" style="margin-top:12px;text-align:center">Forgot your password? Ask the Admin to reset it.</p>
  </div>`;
  setTimeout(() => $('#liId')?.focus(), 50);
}
function lockState(){ try{ return JSON.parse(localStorage.getItem('srs_lock') || '{"n":0,"until":0}'); }catch(e){ return { n:0, until:0 }; } }
function setLock(v){ try{ localStorage.setItem('srs_lock', JSON.stringify(v)); }catch(e){} }
async function doLogin(){
  const lk = lockState();
  if(lk.until > Date.now()) return toast(`Too many wrong tries — wait ${Math.ceil((lk.until - Date.now()) / 1000)} seconds`);
  const id = cleanId($('#liId').value), pass = $('#liPass').value;
  if(!id || !pass) return toast('Enter login ID and password');
  const users = await DB.list('users');
  const u = users.find(x => loginIdOf(x) === id.replace(/\s+/g, '') || cleanId(x.name) === id);
  if(!u || u.pinHash !== await hashPin(pass)){
    const n = lk.n + 1;
    setLock(n >= 5 ? { n:0, until: Date.now() + 60000 } : { n, until:0 });
    $('#liPass').value = '';
    return toast(n >= 5 ? 'Too many wrong tries — wait 1 minute' : 'Wrong login ID or password');
  }
  if(u.active === false) return toast('This login is disabled — ask the Admin');
  setLock({ n:0, until:0 });
  login(u);
  if(pass.length < 6 || !u.loginId) setTimeout(() => toast('Please set your Login ID and a password of 6+ characters in Settings → Change My Password'), 1200);
}
function login(u){ ME = u; try{ localStorage.setItem('srs_session', u.id); }catch(e){} logEvent('Logged in', ROLE_LABEL[u.role]); startApp(); }
function logout(){ if(!confirm('Logout?')) return; logEvent('Logged out', ''); try{ localStorage.removeItem('srs_session'); }catch(e){} ME = null; location.hash = ''; showLogin(); }

function route(){

/* =========================================================

const CATEGORIES = ['Solar Panel','Inverter','Battery','Structure','Cable & Wire','Accessories','Other'];
const UNITS = ['pcs','set','meter','kg','box','roll'];
const GST_RATES = [0,5,12,18,28];
const TYPE_LABEL = { in:'Stock In', out:'Stock Out', adjust:'Adjustment' };
const money = n => '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits:2 });
const delta = m => m.type === 'in' ? Number(m.qty) : m.type === 'out' ? -Number(m.qty) : Number(m.qty);
function stockMap(movs){ const s = {}; movs.forEach(m => { s[m.productId] = (s[m.productId] || 0) + delta(m); }); return s; }
function statusOf(p, qty){
  if(qty <= 0) return { key:'out', label:'Out of stock' };
  if(p.minStock && qty <= p.minStock) return { key:'low', label:'Low stock' };
  return { key:'ok', label:'In stock' };
}
async function loadWh(){
  const [products, movements] = await Promise.all([DB.list('products'), DB.list('movements')]);
  return { products, movements, sm: stockMap(movements) };
}
const findProduct = (products, name) => products.find(p => p.name.toLowerCase() === name.trim().toLowerCase());

/* One-time move of Phase 1 entries (name/qty/date) into products + stock-in records */
async function migrateLegacy(){
  const old = await DB.list('stock');
  if(!old.length || (await DB.list('products')).length) return;
  const products = [], movements = [];
  old.forEach(e => {
    let p = findProduct(products, e.name);
    if(!p){ p = { id:uid(), name:e.name, category:'Other', unit:'pcs', hsn:'', gst:18, costPrice:0, salePrice:0, minStock:0, active:true, createdAt:e.createdAt || Date.now() }; products.push(p); }
    movements.push({ id:uid(), productId:p.id, productName:p.name, type:'in', qty:Number(e.qty), date:e.date, note:'Opening entry',
      addedBy:e.addedBy || '', addedByName:e.addedByName || '', createdAt:e.createdAt || Date.now() });
  });
  await DB.saveAll('products', products);
  await DB.saveAll('movements', movements);
  await DB.saveAll('stock', []);
}

async function renderDashboard(){
  const [{ products, movements, sm }, { invoices, payments }] = await Promise.all([loadWh(), loadBill()]);
  const today = todayStr(), month = today.slice(0,7);
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const recent = [...movements].sort((a,b) => b.createdAt - a.createdAt);
  const active = products.filter(p => p.active !== false);
  const alerts = active.map(p => ({ p, qty: sm[p.id] || 0 })).filter(x => statusOf(x.p, x.qty).key !== 'ok').sort((a,b) => a.qty - b.qty);
  const live = invoices.filter(i => !i.cancelled);
  const paidMap = paidByInvoice(payments);
  const sales = list => list.reduce((a,i) => a + i.total, 0);
  const [emps, att] = await Promise.all([DB.list('employees'), DB.list('attendance')]);
  const staff = emps.filter(e => e.active !== false);
  const presentToday = att.filter(a => a.date === today && (a.status === 'P' || a.status === 'H') && staff.some(e => e.id === a.empId)).length;
  const meEmp = emps.find(e => e.userId === ME.id);
  const quick = `<div class="card"><h3>Quick Actions</h3><div class="quick">
      <a class="btn" href="#billing/new" style="text-decoration:none">🧾 New Bill</a>
      <button class="btn ghost" onclick="goMove('in')">➕ Stock In</button>
      <button class="btn ghost" onclick="goMove('out')">➖ Stock Out</button></div></div>`;
  let html = `<p class="muted" style="margin-bottom:12px">${greet}, ${esc(ME.name.split(' ')[0])} 👋</p>`;

  if(isMgr()){
    const value = active.reduce((a,p) => a + Math.max(sm[p.id] || 0, 0) * Number(p.costPrice || 0), 0);
    const days14 = Array.from({ length:14 }, (_, k) => { const dt = new Date(); dt.setDate(dt.getDate() - 13 + k); return new Date(dt.getTime() - dt.getTimezoneOffset() * 60000).toISOString().slice(0,10); });
    const perDay = days14.map(x => sales(live.filter(i => i.date === x))), maxDay = Math.max(...perDay, 1);
    const chart = `<div class="card"><h3>📈 Sales — last 14 days <span class="muted">${money(perDay.reduce((a,b) => a + b, 0))}</span></h3>
      <div class="chart">${days14.map((x, k) => `<div class="col" title="${fmtDate(x)}: ${money(perDay[k])}"><div class="b ${x === today ? 'today' : ''}" style="height:${perDay[k] ? Math.max(perDay[k] / maxDay * 100, 3) : 0}%"></div><small>${Number(x.slice(8))}</small></div>`).join('')}</div></div>`;
    const bk = await DB.getDoc('backupInfo');
    const needBackup = (invoices.length || movements.length) && (!bk || Date.now() - bk.lastBackup > 7 * 864e5);
    const backupCard = needBackup ? `<div class="card" style="border-left:4px solid var(--danger)"><h3>💾 Time for a backup <button class="btn sm" onclick="exportBackup().then(renderDashboard)">⬇️ Download Backup</button></h3>
      <p class="muted">${bk ? 'Last backup was ' + Math.floor((Date.now() - bk.lastBackup) / 864e5) + ' days ago.' : 'You haven’t backed up yet.'} A backup file keeps a safe copy outside the cloud.</p></div>` : '';
    const dues = live.reduce((a,i) => a + Math.max(i.total - (paidMap[i.id] || 0), 0), 0);
    html += `<div class="stats">
        <div class="stat"><span>Today's Sales</span><b>${money(sales(live.filter(i => i.date === today)))}</b></div>
        <div class="stat"><span>This Month's Sales</span><b>${money(sales(live.filter(i => i.date.startsWith(month))))}</b></div>
        <div class="stat" style="border-color:${dues ? 'var(--danger)' : 'var(--ok)'}"><span>Customer Dues</span><b>${money(dues)}</b></div>
        <div class="stat"><span>Stock Value (cost)</span><b>${money(value)}</b></div>
        ${staff.length ? `<div class="stat"><span>Staff Present Today</span><b>${presentToday} / ${staff.length}</b></div>` : ''}
        <div class="stat" style="border-color:${alerts.length ? 'var(--danger)' : 'var(--ok)'}"><span>Low / Out of Stock</span><b>${alerts.length}</b></div>
      </div>${backupCard}${quick}${chart}
      <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
        <div class="card"><h3>Recent Bills <a href="#billing" class="muted">All bills →</a></h3>${billList([...invoices].sort((a,b) => b.createdAt - a.createdAt).slice(0,6), paidMap)}</div>
        <div class="card"><h3>⚠️ Stock Alerts <a href="#warehouse" class="muted">Warehouse →</a></h3>
          ${alerts.length ? alerts.slice(0,8).map(x => { const s = statusOf(x.p, x.qty); return `<div class="list-item"><div class="grow"><b>${esc(x.p.name)}</b><div class="muted">Min ${num(x.p.minStock)} ${esc(x.p.unit)}</div></div><span class="badge ${s.key}">${num(x.qty)} ${esc(x.p.unit)}</span></div>`; }).join('') : `<div class="empty">All products are well stocked ✅</div>`}
        </div>
        <div class="card"><h3>Recent Stock Activity</h3>${moveList(recent.slice(0,6))}</div>
      </div>`;
  } else {
    const mine = recent.filter(m => m.addedBy === ME.id && !m.invoiceId);
    const myBills = live.filter(i => i.createdBy === ME.id);
    html += `<div class="stats">
        <div class="stat"><span>My Bills Today</span><b>${num(myBills.filter(i => i.date === today).length)}</b></div>
        ${meEmp ? `<div class="stat"><span>My Days This Month</span><b>${(c => c.P + c.H / 2)(attCounts(att, meEmp.id, month))}</b></div>` : ''}
        <div class="stat"><span>My Sales Today</span><b>${money(sales(myBills.filter(i => i.date === today)))}</b></div>
        <div class="stat"><span>Low / Out of Stock</span><b>${alerts.length}</b></div>
      </div>${quick}
      <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
        <div class="card"><h3>My Recent Bills</h3>${billList([...myBills].sort((a,b) => b.createdAt - a.createdAt).slice(0,6), paidMap)}</div>
        <div class="card"><h3>My Stock Entries</h3>${moveList(mine.slice(0,6))}</div>
      </div>`;
  }
  $('#main').innerHTML = html;
}
function moveList(rows){
  if(!rows.length) return `<div class="empty">No stock activity yet.</div>`;
  return rows.map(m => `<div class="list-item"><div class="grow"><b>${esc(m.productName)}</b>
    <div class="muted">${m.invoiceId ? 'Sale' : m.purchaseId ? 'Purchase' : TYPE_LABEL[m.type]} · ${fmtDate(m.date)}${m.addedByName ? ' · ' + esc(m.addedByName) : ''}</div></div>
    <span class="qty" style="color:${delta(m) < 0 ? 'var(--danger)' : 'var(--ok)'}">${delta(m) > 0 ? '+' : ''}${num(delta(m))}</span></div>`).join('');
}
function billList(rows, paidMap){
  if(!rows.length) return `<div class="empty">No bills yet.</div>`;
  return rows.map(i => { const s = invStatus(i, paidMap[i.id] || 0); return `<div class="list-item" style="cursor:pointer" onclick="location.hash='billing/view/${i.id}'">
    <div class="grow"><b>${esc(i.customer.name)}</b><div class="muted">${esc(i.no)} · ${fmtDate(i.date)}</div></div>
    <div style="text-align:right"><b>${money(i.total)}</b><br><span class="badge ${s.key}">${s.label}</span></div></div>`; }).join('');
}

async function whRender(){
  if(!$('#whStats')) return;
  const { products, sm } = await loadWh();
  const active = products.filter(p => p.active !== false);
  const alerts = active.filter(p => statusOf(p, sm[p.id] || 0).key !== 'ok').length;
  const value = active.reduce((a,p) => a + Math.max(sm[p.id] || 0, 0) * Number(p.costPrice || 0), 0);
  $('#whStats').innerHTML = `
    <div class="stat"><span>Products</span><b>${num(active.length)}</b></div>
    <div class="stat"><span>Units in Stock</span><b>${num(active.reduce((a,p) => a + Math.max(sm[p.id] || 0, 0), 0))}</b></div>
    ${isMgr() ? `<div class="stat"><span>Stock Value (cost)</span><b>${money(value)}</b></div>` : ''}
    <div class="stat" style="border-color:${alerts ? 'var(--danger)' : 'var(--ok)'}"><span>Low / Out of Stock</span><b>${alerts}</b></div>`;
  document.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === W.tab));

  const search = `<input id="whSearch" placeholder="🔍 Search product..." oninput="whBody()">`;
  if(W.tab === 'stock') $('#whFilters').innerHTML = `${search}
    <div class="quick"><select id="whFilter" onchange="W.filter=this.value;whBody()">
      <option value="all">All products</option><option value="alert" ${W.filter === 'alert' ? 'selected' : ''}>Low & out of stock</option></select>
      <button class="btn sm ghost" onclick="exportStockCsv()">⬇️ CSV</button></div>`;
  else if(W.tab === 'products') $('#whFilters').innerHTML = `${search}${isMgr() ? `<button class="btn sm" onclick="productModal()">➕ Add Product</button>` : ''}`;
  else $('#whFilters').innerHTML = `${search}
    <select id="whType" onchange="W.mtype=this.value;whBody()">
      ${['all','in','out','adjust'].map(t => `<option value="${t}" ${W.mtype === t ? 'selected' : ''}>${t === 'all' ? 'All types' : TYPE_LABEL[t]}</option>`).join('')}</select>`;

  openModal(p ? 'Edit Product' : 'Add Product', `
    <label>Product Name</label><input id="pName" value="${esc(p?.name)}" placeholder="e.g. 540W Mono PERC Panel">
    <div class="row2">
      <div><label>Category</label><select id="pCat">${opt(CATEGORIES, p?.category || 'Solar Panel')}</select></div>
      <div><label>Unit</label><select id="pUnit">${opt(UNITS, p?.unit || 'pcs')}</select></div>
    </div>
    <div class="row2">
      <div><label>HSN Code</label><input id="pHsn" inputmode="numeric" value="${esc(p?.hsn)}"></div>
      <div><label>GST Rate</label><select id="pGst">${opt(GST_RATES, p?.gst ?? 12, x => x + '%')}</select></div>
    </div>
    <div class="row2">
      <div><label>Purchase Price (₹)</label><input id="pCost" type="number" min="0" step="0.01" inputmode="decimal" value="${p?.costPrice ?? ''}"></div>
      <div><label>Sale Price (₹)</label><input id="pSale" type="number" min="0" step="0.01" inputmode="decimal" value="${p?.salePrice ?? ''}"></div>
    </div>
    <label>Low-stock alert at (quantity)</label><input id="pMin" type="number" min="0" inputmode="numeric" value="${p?.minStock ?? ''}" placeholder="0 = alert only when out of stock">

async function saveProduct(id){
  const name = $('#pName').value.trim();
  if(!name) return toast('Enter product name');
  const products = await DB.list('products');
  const dup = findProduct(products, name);
  if(dup && dup.id !== id) return toast('A product with this name already exists');
  const data = { name, category:$('#pCat').value, unit:$('#pUnit').value, hsn:$('#pHsn').value.trim(), gst:Number($('#pGst').value),
    costPrice:Number($('#pCost').value) || 0, salePrice:Number($('#pSale').value) || 0, minStock:parseInt($('#pMin').value, 10) || 0 };
  if(id){
    data.active = $('#pActive').checked;
    await DB.update('products', id, data);
    const old = products.find(p => p.id === id);
    if(old && old.name !== name){ // keep history names in sync
      const movs = await DB.list('movements');
      movs.forEach(m => { if(m.productId === id) m.productName = name; });
      await DB.saveAll('movements', movs);
    }
    toast('Product updated');
  } else {
    await DB.add('products', { ...data, active:true, createdAt:Date.now() });
    toast('Product added');
  }
  closeModal(); refreshPage();
}
async function deleteProduct(id){
  const used = (await DB.list('movements')).some(m => m.productId === id);
  if(used){
    if(!confirm('This product has stock history, so it can’t be deleted. Mark it inactive instead?')) return;
    await DB.update('products', id, { active:false }); toast('Product marked inactive');
  } else {
    if(!confirm('Delete this product?')) return;
    await DB.remove('products', id); toast('Product deleted');
  }
  refreshPage();
}

function mvType(t){
  M.type = t;
  document.querySelectorAll('[data-mt]').forEach(b => b.classList.toggle('on', b.dataset.mt === t));
  $('#mvQtyLbl').textContent = t === 'adjust' ? 'Actual count' : 'Quantity';
  $('#mvNoteLbl').textContent = t === 'in' ? 'Supplier / Note' : t === 'out' ? 'Customer / Note' : 'Reason (damage, recount…)';
  $('#mvNote').placeholder = t === 'in' ? 'e.g. Supplier name, bill no.' : t === 'out' ? 'e.g. Customer name' : 'e.g. 2 panels damaged';
  $('#mvSave').textContent = t === 'in' ? 'Add Stock' : t === 'out' ? 'Remove Stock' : 'Set Stock';
  mvAvail();
}
async function mvAvail(){
  const { products, movements } = await loadWh();
  const p = findProduct(products, $('#mvProd')?.value || '');
  const el = $('#mvAvail'); if(!el) return;
  if(!p){ el.textContent = ($('#mvProd').value.trim() && M.type === 'in') ? 'New product — it will be added to your catalog.' : ''; return; }
  const avail = stockMap(movements.filter(m => m.id !== M.edit))[p.id] || 0;
  el.innerHTML = `Available: <b>${num(avail)} ${esc(p.unit)}</b>`;
}
async function saveMove(){
  const { products, movements } = await loadWh();
  const name = $('#mvProd').value.trim();
  const n = parseInt($('#mvQty').value, 10), date = $('#mvDate').value, note = $('#mvNote').value.trim();
  if(!name) return toast('Choose a product');
  if(!date) return toast('Select a date');
  let p = findProduct(products, name);
  if(!p){
    if(M.type !== 'in') return toast('Product not found in catalog');
    if(!confirm(`“${name}” is a new product. Add it to the catalog?`)) return;
    p = await DB.add('products', { name, category:'Other', unit:'pcs', hsn:'', gst:12, costPrice:0, salePrice:0, minStock:0, active:true, createdAt:Date.now() });
  }
  const avail = stockMap(movements.filter(m => m.id !== M.edit))[p.id] || 0;
  let qty;
  if(M.type === 'adjust'){
    if(isNaN(n) || n < 0) return toast('Enter the actual count');
    qty = n - avail;
    if(qty === 0) return toast('Count matches current stock — nothing to adjust');
  } else {
    if(!n || n < 1) return toast('Enter a valid quantity');
    if(M.type === 'out' && n > avail) return toast(`Only ${avail} ${p.unit} available`);
    if(M.type === 'in' && avail + n < 0) return toast(`At least ${-avail} ${p.unit} already sold from this entry`);
    qty = n;
  }
  if(M.edit){
    await DB.update('movements', M.edit, { qty, date, note, editedBy:ME.name, editedAt:Date.now() });
    toast('Entry updated');
  } else {
    await DB.add('movements', { productId:p.id, productName:p.name, type:M.type, qty, date, note,
      addedBy:ME.id, addedByName:ME.name, createdAt:Date.now() });
    toast(M.type === 'in' ? 'Stock added' : M.type === 'out' ? 'Stock removed' : 'Stock adjusted');
  }
  closeModal(); refreshPage();
}
async function deleteMove(id){
  const { movements } = await loadWh();
  const m = movements.find(x => x.id === id); if(!m) return;
  if(m.invoiceId) return toast('This entry belongs to a bill — cancel or edit the bill instead');
  if(m.purchaseId) return toast('This entry belongs to a purchase — delete it from Accounts instead');
  if(m.type === 'in'){
    const after = stockMap(movements.filter(x => x.id !== id))[m.productId] || 0;
    if(after < 0) return toast('Can’t delete — stock already sold from this entry');
  }
  if(!confirm('Delete this stock entry?')) return;
  await DB.remove('movements', id); toast('Entry deleted'); refreshPage();
}

async function exportStockCsv(){
  const { products, sm } = await loadWh();
  const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const head = ['Product','Category','Unit','HSN','GST %','In Stock','Min Stock','Status'].concat(isMgr() ? ['Cost Price','Stock Value'] : []);
  const lines = products.filter(p => p.active !== false).sort((a,b) => a.name.localeCompare(b.name)).map(p => {
    const q = sm[p.id] || 0;
    return [p.name, p.category, p.unit, p.hsn, p.gst, q, p.minStock, statusOf(p, q).label]
      .concat(isMgr() ? [p.costPrice, Math.max(q,0) * Number(p.costPrice || 0)] : []).map(cell).join(',');
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + [head.map(cell).join(','), ...lines].join('\n')], { type:'text/csv' }));

  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

   BILLING
   ========================================================= */
const PAY_MODES = ['Cash','UPI','Card','Bank Transfer'];
const STATES = ['Andhra Pradesh','Arunachal Pradesh','Assam','Bihar','Chhattisgarh','Goa','Gujarat','Haryana','Himachal Pradesh','Jharkhand','Karnataka','Kerala','Madhya Pradesh','Maharashtra','Manipur','Meghalaya','Mizoram','Nagaland','Odisha','Punjab','Rajasthan','Sikkim','Tamil Nadu','Telangana','Tripura','Uttar Pradesh','Uttarakhand','West Bengal','Andaman and Nicobar Islands','Chandigarh','Dadra and Nagar Haveli and Daman and Diu','Delhi','Jammu and Kashmir','Ladakh','Lakshadweep','Puducherry'];
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const fy = d => { const [y, m] = d.split('-').map(Number); const s = m >= 4 ? y : y - 1; return `${String(s).slice(2)}-${String(s + 1).slice(2)}`; };
let B = { q:'', status:'all', month:'', printNext:false };

async function loadBill(){
  const [invoices, payments, customers] = await Promise.all([DB.list('invoices'), DB.list('payments'), DB.list('customers')]);
  return { invoices, payments, customers };
}
function paidByInvoice(payments){ const m = {}; payments.forEach(p => { m[p.invoiceId] = (m[p.invoiceId] || 0) + Number(p.amount); }); return m; }
function invStatus(inv, paid){
  if(inv.cancelled) return { key:'off', label:'Cancelled' };
  if(paid >= inv.total - 0.009) return { key:'ok', label:'Paid' };
  if(paid > 0) return { key:'low', label:'Partial' };
  return { key:'out', label:'Unpaid' };
}
function calcInvoice(items, interState, incl){
  let taxable = 0, tax = 0;
  const rows = items.map(it => {
    const g = Number(it.gst || 0);
    const gross = Number(it.qty || 0) * Number(it.rate || 0) * (1 - Number(it.disc || 0) / 100);
    const tv = incl ? gross / (1 + g / 100) : gross;
    const t = tv * g / 100;
    taxable += tv; tax += t;
    return { ...it, taxable: r2(tv), tax: r2(t), amount: r2(tv + t) };
  });
  const exact = taxable + tax, total = Math.round(exact);
  return { rows, taxable:r2(taxable), tax:r2(tax), cgst: interState ? 0 : r2(tax / 2), sgst: interState ? 0 : r2(tax / 2),
    igst: interState ? r2(tax) : 0, roundOff: r2(total - exact), total };
}
function inWords(n){
  const a = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two = x => x < 20 ? a[x] : b[Math.floor(x / 10)] + (x % 10 ? ' ' + a[x % 10] : '');
  const three = x => x >= 100 ? a[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' + two(x % 100) : '') : two(x);
  n = Math.round(Math.abs(n)); if(!n) return 'Zero';
  const out = [], cr = Math.floor(n / 1e7); n %= 1e7;
  const l = Math.floor(n / 1e5); n %= 1e5; const th = Math.floor(n / 1000); n %= 1000;
  if(cr) out.push(inWords(cr) + ' Crore'); if(l) out.push(two(l) + ' Lakh'); if(th) out.push(two(th) + ' Thousand'); if(n) out.push(three(n));
  return out.join(' ');
}
async function nextInvoiceNo(date){
  const prefix = (SETTINGS.invPrefix || 'SRS/{FY}/').replace('{FY}', fy(date));
  const max = (await DB.list('invoices')).filter(i => i.no.startsWith(prefix)).reduce((m, i) => Math.max(m, parseInt(i.no.slice(prefix.length), 10) || 0), 0);
  return prefix + String(max + 1).padStart(4, '0');
}

}

  beTotals();
}
function beKey(e, i){
  if(e.key !== 'Enter') return;
  e.preventDefault();
  if(i === BE.items.length - 1) beAdd(); else $('#bp' + (i + 1))?.focus();
}
function beAdd(){ BE.items.push(blankItem()); beRenderItems(); beTotals(); $('#bp' + (BE.items.length - 1))?.focus(); }
function beRemove(i){ BE.items.splice(i, 1); if(!BE.items.length) BE.items.push(blankItem()); beRenderItems(); beTotals(); }
function beCust(){
  const c = BE.customers.find(x => x.name.toLowerCase() === $('#bcName').value.trim().toLowerCase());
  if(!c) return;
  $('#bcPhone').value = c.phone || ''; $('#bcGst').value = c.gstin || '';
  $('#bcState').value = c.state || ''; $('#bcAddr').value = c.address || '';
  beTotals();
}
function beInter(){
  const cs = ($('#bcState')?.value || '').trim().toLowerCase(), ms = (SETTINGS.state || '').trim().toLowerCase();
  return !!(cs && ms && cs !== ms);
}
function beMode(){ BE.recvTouched = false; beTotals(); }
function beTotals(){
  const c = calcInvoice(BE.items.filter(it => it.name.trim()), beInter(), !!SETTINGS.pricesIncludeGst);
  const line = (l, v, cls = '') => `<div class="sumline ${cls}"><span>${l}</span><span>${v}</span></div>`;
  $('#beTotals').innerHTML = line('Taxable value', money(c.taxable))
    + (beInter() ? line('IGST', money(c.igst)) : line('CGST', money(c.cgst)) + line('SGST', money(c.sgst)))
    + (c.roundOff ? line('Round off', (c.roundOff > 0 ? '+' : '') + c.roundOff.toFixed(2)) : '')
    + line('Total', money(c.total), 'total');
  const recv = $('#beRecv');
  if(recv && !BE.recvTouched) recv.value = $('#bePay').value === 'Credit' ? 0 : c.total;
}
async function beSave(print){
  const cust = { name:$('#bcName').value.trim(), phone:$('#bcPhone').value.trim(), gstin:$('#bcGst').value.trim().toUpperCase(),
    state:$('#bcState').value.trim(), address:$('#bcAddr').value.trim() };
  if(!cust.name) return toast('Enter customer name');
  const items = BE.items.filter(it => it.name.trim());
  if(!items.length) return toast('Add at least one item');
  for(const it of items){
    if(!(Number(it.qty) > 0)) return toast(`Enter quantity for ${it.name}`);
    if(it.rate === '' || Number(it.rate) < 0) return toast(`Enter rate for ${it.name}`);
    if(Number(it.disc || 0) < 0 || Number(it.disc || 0) > 100) return toast(`Discount for ${it.name} must be 0–100%`);
  }
  const need = {};
  items.forEach(it => { if(it.productId) need[it.productId] = (need[it.productId] || 0) + Number(it.qty); });
  for(const pid in need){
    const have = BE.sm[pid] || 0;
    if(need[pid] > have){ const p = BE.products.find(x => x.id === pid); return toast(`Only ${num(have)} ${p.unit} of ${p.name} in stock`); }
  }
  const date = $('#beDate').value; if(!date) return toast('Select bill date');
  const incl = !!SETTINGS.pricesIncludeGst, interState = beInter();
  const c = calcInvoice(items, interState, incl);
  const recv = BE.editId ? 0 : Number($('#beRecv').value || 0), mode = BE.editId ? '' : $('#bePay').value;
  if(recv < 0 || recv > c.total) return toast('Received amount can’t be more than the total');

  const customers = await DB.list('customers');
  let cr = customers.find(x => x.name.toLowerCase() === cust.name.toLowerCase());
  if(cr) await DB.update('customers', cr.id, cust); else cr = await DB.add('customers', { ...cust, createdAt:Date.now() });

  const data = { date, customerId:cr.id, customer:cust, interState, pricesIncludeGst:incl, note:$('#beNote').value.trim(),
    items: c.rows.map(r => ({ productId:r.productId, name:r.name.trim(), hsn:r.hsn || '', unit:r.unit || 'pcs', qty:Number(r.qty), rate:Number(r.rate),
      disc:Number(r.disc || 0), gst:Number(r.gst), taxable:r.taxable, tax:r.tax, amount:r.amount,
      cost: r.productId ? Number(BE.products.find(p => p.id === r.productId)?.costPrice || 0) : 0 })),
    taxable:c.taxable, cgst:c.cgst, sgst:c.sgst, igst:c.igst, tax:c.tax, roundOff:c.roundOff, total:c.total };
  let inv;
  if(BE.editId){
    await DB.update('invoices', BE.editId, { ...data, editedBy:ME.name, editedAt:Date.now() });
    inv = { ...BE.inv, ...data };
    await DB.saveAll('movements', (await DB.list('movements')).filter(m => m.invoiceId !== inv.id));
    await DB.saveAll('payments', (await DB.list('payments')).map(p => p.invoiceId === inv.id ? { ...p, customerName:cust.name } : p));
  } else {
    inv = await DB.add('invoices', { ...data, no: await nextInvoiceNo(date), cancelled:false, createdBy:ME.id, createdByName:ME.name, createdAt:Date.now() });
    if(recv > 0) await DB.add('payments', { invoiceId:inv.id, invoiceNo:inv.no, customerId:cr.id, customerName:cust.name, amount:r2(recv), date, mode,
      note:'At billing', addedBy:ME.id, addedByName:ME.name, createdAt:Date.now() });
  }
  for(const it of data.items) if(it.productId)
    await DB.add('movements', { productId:it.productId, productName:it.name, type:'out', qty:it.qty, date, note:`Bill ${inv.no} · ${cust.name}`,
      invoiceId:inv.id, addedBy:ME.id, addedByName:ME.name, createdAt:Date.now() });
  toast(BE.editId ? 'Bill updated' : `Bill ${inv.no} saved`);
  B.printNext = print;
  location.hash = 'billing/view/' + inv.id;
}

function loadQrLib(){
  if(window.QRCode) return Promise.resolve();
  return new Promise((res, rej) => { const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
}
async function drawQr(){
  const els = document.querySelectorAll('.upi-qr'); if(!els.length) return;
  try{ await loadQrLib(); els.forEach(el => { el.innerHTML = ''; new QRCode(el, { text:el.dataset.upi, width:92, height:92, correctLevel:QRCode.CorrectLevel.M }); }); }
  catch(e){ els.forEach(el => el.remove()); }
}

async function shareInvoice(id){
  const { invoices, payments } = await loadBill();

async function savePayment(id, bal){
  const amt = r2($('#pyAmt').value), date = $('#pyDate').value;

  await DB.add('payments', { invoiceId:id, invoiceNo:inv.no, customerId:inv.customerId, customerName:inv.customer.name, amount:amt, date,

async function deletePayment(pid, id){

async function cancelInvoice(id){
  const paid = (await DB.list('payments')).filter(p => p.invoiceId === id).reduce((a,p) => a + Number(p.amount), 0);
  if(!confirm(`Cancel this bill? Its items will go back into stock.${paid ? `\n\nPayments of ${money(paid)} on this bill will also be removed — refund the customer separately.` : ''}`)) return;
  await DB.update('invoices', id, { cancelled:true, cancelledBy:ME.name, cancelledAt:Date.now() });
  await DB.saveAll('movements', (await DB.list('movements')).filter(m => m.invoiceId !== id));
  await DB.saveAll('payments', (await DB.list('payments')).filter(p => p.invoiceId !== id));
  toast('Bill cancelled — stock restored'); renderInvoiceView(id);
}

/* =========================================================
   ACCOUNTS
   Every money event is stored once (bills, receipts, purchases,
   vendor payments, expenses, income, transfers). Ledgers, cash
   book and P&L are always calculated from those records.
   ========================================================= */
const EXP_CATS = ['Rent','Salary & Wages','Electricity','Transport & Freight','Fuel','Repairs & Maintenance','Office Supplies','Phone & Internet','Marketing','Bank Charges','Other'];
const accOf = mode => mode === 'Cash' ? 'Cash' : 'Bank';
/* Salary counts as an expense at its full earned amount (advance recovered + cash paid) */
const asExpense = t => t.type === 'salary' ? { ...t, category:'Salary & Wages', amount:t.gross, note:`${monthName(t.month)} · ${t.empName}` } : t;
let A = { month: todayStr().slice(0,7), period:'month', acct:'all', q:'', cat:'all' };

async function loadAcc(){
  const [wh, bill, vendors, purchases, transactions] = await Promise.all([loadWh(), loadBill(), DB.list('vendors'), DB.list('purchases'), DB.list('transactions')]);
  return { ...wh, ...bill, vendors, purchases, transactions };
}
const vpays = d => d.transactions.filter(t => t.type === 'vendor_payment');
function custBalances(d){
  const m = {};
  d.invoices.filter(i => !i.cancelled).forEach(i => { m[i.customerId] = (m[i.customerId] || 0) + i.total; });
  d.payments.forEach(p => { m[p.customerId] = (m[p.customerId] || 0) - Number(p.amount); });
  return m;
}
function vendBalances(d){
  const m = {};
  d.purchases.forEach(p => { m[p.vendorId] = (m[p.vendorId] || 0) + p.total; });
  vpays(d).forEach(t => { m[t.vendorId] = (m[t.vendorId] || 0) - Number(t.amount); });
  return m;
}
function moneyEntries(d){
  const out = [];
  d.payments.forEach(p => out.push({ date:p.date, at:p.createdAt, account:accOf(p.mode), in:Number(p.amount), out:0,
    text:`Receipt · ${p.invoiceNo} · ${p.customerName}`, link:`billing/view/${p.invoiceId}` }));
  d.transactions.forEach(t => {
    const a = Number(t.amount);
    if(t.type === 'transfer'){
      out.push({ date:t.date, at:t.createdAt, account:t.from, in:0, out:a, text:`Transfer to ${t.to}${t.note ? ' · ' + t.note : ''}`, txId:t.id });
      out.push({ date:t.date, at:t.createdAt, account:t.to, in:a, out:0, text:`Transfer from ${t.from}${t.note ? ' · ' + t.note : ''}`, txId:t.id });
    } else if(t.type === 'income') out.push({ date:t.date, at:t.createdAt, account:t.account, in:a, out:0, text:`Income${t.note ? ' · ' + t.note : ''}`, txId:t.id });
    else if(t.type === 'expense') out.push({ date:t.date, at:t.createdAt, account:t.account, in:0, out:a, text:`Expense · ${t.category}${t.note ? ' · ' + t.note : ''}`, txId:t.id });
    else if(t.type === 'vendor_payment') out.push({ date:t.date, at:t.createdAt, account:t.account, in:0, out:a,
      text:`Paid · ${t.vendorName}${t.purchaseNo ? ' · Bill ' + t.purchaseNo : ''}`, link:t.purchaseId ? `accounts/purchase/${t.purchaseId}` : `accounts/party/v/${t.vendorId}` });
    else if(t.type === 'salary') out.push({ date:t.date, at:t.createdAt, account:t.account, in:0, out:a, text:`Salary ${monthName(t.month)} · ${t.empName}`, link:`hr/emp/${t.empId}` });
    else if(t.type === 'advance') out.push({ date:t.date, at:t.createdAt, account:t.account, in:0, out:a, text:`Advance · ${t.empName}${t.note ? ' · ' + t.note : ''}`, link:`hr/emp/${t.empId}` });
  });
  return out.sort((a,b) => a.date.localeCompare(b.date) || a.at - b.at);
}
function accBalances(d){
  const bal = { Cash: Number(SETTINGS.openingCash || 0), Bank: Number(SETTINGS.openingBank || 0) };
  moneyEntries(d).forEach(e => { bal[e.account] += e.in - e.out; });
  return bal;
}
function periodRange(p){
  const t = todayStr(), [y, m] = t.split('-').map(Number);
  const pad = n => String(n).padStart(2, '0');
  const lastDay = (yy, mm) => new Date(yy, mm, 0).getDate();
  if(p === 'month') return [`${y}-${pad(m)}-01`, `${y}-${pad(m)}-${lastDay(y,m)}`];
  if(p === 'lastmonth'){ const yy = m === 1 ? y - 1 : y, mm = m === 1 ? 12 : m - 1; return [`${yy}-${pad(mm)}-01`, `${yy}-${pad(mm)}-${lastDay(yy,mm)}`]; }
  if(p === 'fy'){ const s = m >= 4 ? y : y - 1; return [`${s}-04-01`, `${s + 1}-03-31`]; }
  return ['0000-01-01', '9999-12-31'];
}

/* ---------- Overview & profit/loss ---------- */
async function accOverview(){
  const d = await loadAcc();
  const [from, to] = periodRange(A.period), inR = x => x >= from && x <= to;
  const sales = d.invoices.filter(i => !i.cancelled && inR(i.date));
  const costOf = {}; d.products.forEach(p => { costOf[p.id] = Number(p.costPrice || 0); });
  const salesTaxable = sales.reduce((a,i) => a + i.taxable, 0);
  const cogs = sales.reduce((a,i) => a + i.items.reduce((b,it) => b + (it.productId ? Number(it.qty) * (it.cost ?? costOf[it.productId] ?? 0) : 0), 0), 0);
  const exps = d.transactions.filter(t => (t.type === 'expense' || t.type === 'salary') && inR(t.date)).map(asExpense);
  const expTotal = exps.reduce((a,t) => a + Number(t.amount), 0);
  const received = d.payments.filter(p => inR(p.date)).reduce((a,p) => a + Number(p.amount), 0);
  const bought = d.purchases.filter(p => inR(p.date)).reduce((a,p) => a + p.total, 0);
  const gross = salesTaxable - cogs, net = gross - expTotal;
  const bal = accBalances(d);
  const recv = Object.values(custBalances(d)).reduce((a,v) => a + Math.max(v, 0), 0);
  const pay = Object.values(vendBalances(d)).reduce((a,v) => a + Math.max(v, 0), 0);
  const byCat = {}; exps.forEach(t => { byCat[t.category] = (byCat[t.category] || 0) + Number(t.amount); });
  const cats = Object.entries(byCat).sort((a,b) => b[1] - a[1]), maxCat = cats[0]?.[1] || 1;
  const line = (l, v, cls = '', color = '') => `<div class="sumline ${cls}"><span>${l}</span><span style="${color ? 'color:' + color : ''}">${v}</span></div>`;
  $('#accBody').innerHTML = `
    <div class="toolbar"><b>Position today</b></div>
    <div class="stats">
      <div class="stat"><span>💵 Cash in Hand</span><b>${money(bal.Cash)}</b></div>
      <div class="stat"><span>🏦 Bank / UPI</span><b>${money(bal.Bank)}</b></div>
      <div class="stat" style="border-color:var(--ok)"><span>To Receive (customers)</span><b>${money(recv)}</b></div>
      <div class="stat" style="border-color:var(--danger)"><span>To Pay (vendors)</span><b>${money(pay)}</b></div>
    </div>
    <div class="toolbar"><b>Performance</b>
      <select onchange="A.period=this.value;accOverview()">${[['month','This month'],['lastmonth','Last month'],['fy','This financial year'],['all','All time']].map(([k,l]) => `<option value="${k}" ${A.period === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="stats">
      <div class="stat"><span>Sales (${sales.length} bills)</span><b>${money(sales.reduce((a,i) => a + i.total, 0))}</b></div>
      <div class="stat"><span>Money Received</span><b>${money(received)}</b></div>
      <div class="stat"><span>Purchases</span><b>${money(bought)}</b></div>
      <div class="stat"><span>Expenses</span><b>${money(expTotal)}</b></div>
    </div>
    <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
      <div class="card"><h3>📊 Profit & Loss <span class="muted">${A.period === 'all' ? 'All time' : fmtDate(from) + ' – ' + fmtDate(to)}</span></h3>
        ${line('Sales (before GST)', money(salesTaxable))}
        ${line('Cost of goods sold', '− ' + money(cogs))}
        ${line('Gross profit', money(gross), 'total')}
        ${line('Expenses', '− ' + money(expTotal))}
        ${line(net >= 0 ? 'Net profit' : 'Net loss', money(Math.abs(net)), 'total', net >= 0 ? 'var(--ok)' : 'var(--danger)')}
        <p class="muted" style="margin-top:8px">Cost of goods uses each product's purchase price. GST is excluded because it's collected for the government.</p>
      </div>
      <div class="card"><h3>💸 Expenses by Category</h3>
        ${cats.length ? cats.map(([c, v]) => `<div style="margin:8px 0"><div class="sumline" style="padding:0 0 3px"><span>${esc(c)}</span><b>${money(v)}</b></div>
          <div class="bar"><span style="width:${Math.max(v / maxCat * 100, 2)}%"></span></div></div>`).join('') : `<div class="empty">No expenses in this period.</div>`}
      </div>
    </div>`;
}

async function savePurchase(){
  const vname = $('#pvName').value.trim();
  if(!vname) return toast('Enter vendor name');
  const items = PE.items.filter(it => it.name.trim());
  if(!items.length) return toast('Add at least one item');
  for(const it of items){
    if(!(Number(it.qty) > 0)) return toast(`Enter quantity for ${it.name}`);
    if(it.rate === '' || Number(it.rate) < 0) return toast(`Enter cost for ${it.name}`);
  }
  const date = $('#peDate').value; if(!date) return toast('Select date');
  const c = calcInvoice(items, false, false);
  const paid = r2($('#pePaid').value || 0), mode = $('#peMode').value;
  if(paid < 0 || paid > c.total) return toast('Paid amount can’t be more than the total');

  const vdata = { name:vname, phone:$('#pvPhone').value.trim(), gstin:$('#pvGst').value.trim().toUpperCase() };
  const vendors = await DB.list('vendors');
  let v = vendors.find(x => x.name.toLowerCase() === vname.toLowerCase());
  if(v) await DB.update('vendors', v.id, { ...v, ...vdata }); else v = await DB.add('vendors', { ...vdata, address:'', createdAt:Date.now() });

  const rows = [];
  for(const r of c.rows){
    let p = r.productId ? PE.products.find(x => x.id === r.productId) : findProduct(await DB.list('products'), r.name);
    if(!p) p = await DB.add('products', { name:r.name.trim(), category:'Other', unit:'pcs', hsn:'', gst:Number(r.gst), costPrice:Number(r.rate), salePrice:0, minStock:0, active:true, createdAt:Date.now() });
    else await DB.update('products', p.id, { costPrice:Number(r.rate) });
    rows.push({ productId:p.id, name:p.name, unit:p.unit || 'pcs', qty:Number(r.qty), rate:Number(r.rate), gst:Number(r.gst), taxable:r.taxable, tax:r.tax, amount:r.amount });
  }
  const pur = await DB.add('purchases', { date, vendorId:v.id, vendorName:v.name, billNo:$('#pvBill').value.trim(), items:rows,
    taxable:c.taxable, tax:c.tax, roundOff:c.roundOff, total:c.total, note:$('#peNote').value.trim(), addedBy:ME.id, addedByName:ME.name, createdAt:Date.now() });
  for(const it of rows) await DB.add('movements', { productId:it.productId, productName:it.name, type:'in', qty:it.qty, date,
    note:`Purchase${pur.billNo ? ' ' + pur.billNo : ''} · ${v.name}`, purchaseId:pur.id, addedBy:ME.id, addedByName:ME.name, createdAt:Date.now() });
  if(paid > 0) await DB.add('transactions', { type:'vendor_payment', date, amount:paid, mode, account:accOf(mode), vendorId:v.id, vendorName:v.name,
    purchaseId:pur.id, purchaseNo:pur.billNo, note:'At purchase', addedBy:ME.id, addedByName:ME.name, createdAt:Date.now() });
  toast('Purchase saved — stock added');
  location.hash = 'accounts/purchase/' + pur.id;
}

async function saveCustPay(cid){
  const d = await loadAcc(), amt = r2($('#cpAmt').value), date = $('#cpDate').value, mode = $('#cpMode').value, note = $('#cpNote').value.trim();
  const due = r2(custBalances(d)[cid] || 0);
  if(!(amt > 0)) return toast('Enter amount'); if(amt > due) return toast(`Amount is more than the due (${money(due)})`); if(!date) return toast('Select date');
  const paid = paidByInvoice(d.payments); let left = amt;
  for(const i of d.invoices.filter(i => i.customerId === cid && !i.cancelled).sort((a,b) => a.date.localeCompare(b.date) || a.createdAt - b.createdAt)){
    const open = r2(i.total - (paid[i.id] || 0)); if(open <= 0 || left <= 0) continue;
    const take = r2(Math.min(open, left)); left = r2(left - take);
    await DB.add('payments', { invoiceId:i.id, invoiceNo:i.no, customerId:cid, customerName:i.customer.name, amount:take, date, mode, note,
      addedBy:ME.id, addedByName:ME.name, createdAt:Date.now() });
  }
  closeModal(); toast('Payment recorded'); accRefresh();
}

async function saveVendorPay(vid, purchaseId, due){
  const d = await loadAcc(), amt = r2($('#vpAmt').value), date = $('#vpDate').value, mode = $('#vpMode').value, note = $('#vpNote').value.trim();
  if(!(amt > 0)) return toast('Enter amount'); if(amt > due) return toast(`Amount is more than the due (${money(due)})`); if(!date) return toast('Select date');
  const v = d.vendors.find(x => x.id === vid);
  const paidOn = {}; vpays(d).forEach(t => { if(t.purchaseId) paidOn[t.purchaseId] = (paidOn[t.purchaseId] || 0) + Number(t.amount); });
  const targets = d.purchases.filter(p => p.vendorId === vid && (!purchaseId || p.id === purchaseId)).sort((a,b) => a.date.localeCompare(b.date) || a.createdAt - b.createdAt);
  let left = amt;
  for(const p of targets){
    const open = r2(p.total - (paidOn[p.id] || 0)); if(open <= 0 || left <= 0) continue;
    const take = r2(Math.min(open, left)); left = r2(left - take);
    await DB.add('transactions', { type:'vendor_payment', date, amount:take, mode, account:accOf(mode), vendorId:vid, vendorName:v.name,
      purchaseId:p.id, purchaseNo:p.billNo, note, addedBy:ME.id, addedByName:ME.name, createdAt:Date.now() });
  }
  if(left > 0) await DB.add('transactions', { type:'vendor_payment', date, amount:left, mode, account:accOf(mode), vendorId:vid, vendorName:v.name,
    note, addedBy:ME.id, addedByName:ME.name, createdAt:Date.now() });
  closeModal(); toast('Payment recorded'); accRefresh();
}
